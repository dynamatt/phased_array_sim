<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Phased Array Simulation</title>
    <style>
        :root {
            color-scheme: dark;
            --text: #f2f2f2;
            --text-dim: #9aa0a6;
            --glass-bg: rgba(12, 14, 18, 0.55);
            --glass-border: rgba(255, 255, 255, 0.10);
            --glass-blur: 16px;
            --accent: #f7a828;
            --accent-dim: rgba(247, 168, 40, 0.35);
            --radius: 12px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
        }
        html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: var(--text); font-family: sans-serif; }
        canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
        canvas:active { cursor: grabbing; }

        #axesOverlay { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; transition: opacity 0.2s ease; }
        #axesOverlay.chrome-hidden { opacity: 0; }
        .axis-line { stroke: rgba(255, 255, 255, 0.28); stroke-width: 1; }
        .axis-tick { stroke: rgba(255, 255, 255, 0.45); stroke-width: 1; }
        .axis-label { fill: var(--text-dim); font-size: 11px; font-family: sans-serif; font-variant-numeric: tabular-nums; }

        #controls {
            position: fixed;
            top: 1rem;
            left: 1rem;
            width: min(320px, calc(100vw - 2rem));
            display: flex;
            flex-direction: column;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            transition: opacity 0.2s ease;
        }
        #controls.chrome-hidden { opacity: 0; pointer-events: none; }

        .panel-header { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 0.9rem; flex: 0 0 auto; }
        .panel-header h1 { margin: 0; font-size: 1rem; font-weight: 600; }
        .panel-collapse-btn {
            background: rgba(255, 255, 255, 0.08); border: 1px solid var(--glass-border); color: var(--text);
            width: 1.6rem; height: 1.6rem; border-radius: 50%; cursor: pointer; font-size: 1rem; line-height: 1;
            display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
        }
        .panel-collapse-btn:hover { background: rgba(255, 255, 255, 0.16); }

        .panel-body {
            padding: 0 0.9rem 0.9rem; overflow-y: auto; max-height: 80vh; opacity: 1;
            transition: max-height 0.25s ease, opacity 0.2s ease, padding 0.25s ease;
        }
        .panel-body.collapsed { max-height: 0; opacity: 0; padding-top: 0; padding-bottom: 0; overflow: hidden; }

        .ctl-section { border-top: 1px solid var(--glass-border); padding-top: 0.6rem; margin-top: 0.6rem; }
        .ctl-section:first-child { border-top: none; margin-top: 0; padding-top: 0; }
        .ctl-section summary {
            cursor: pointer; font-size: 0.8rem; letter-spacing: 0.04em; text-transform: uppercase;
            color: var(--accent); margin-bottom: 0.3rem; list-style: none;
        }
        .ctl-section summary::-webkit-details-marker { display: none; }
        .ctl-section summary::before { content: "\25b8  "; display: inline-block; transition: transform 0.15s ease; }
        .ctl-section[open] summary::before { transform: rotate(90deg); }

        .ctl-label { display: flex; justify-content: space-between; font-size: 0.9rem; margin-top: 0.5rem; }
        .ctl-label-left { display: flex; align-items: center; gap: 0.35rem; }
        .ctl-value { font-variant-numeric: tabular-nums; color: var(--text-dim); }

        .ctl-help-btn {
            width: 1.1rem; height: 1.1rem; flex: 0 0 auto; border-radius: 50%; cursor: pointer; line-height: 1;
            display: flex; align-items: center; justify-content: center; font-size: 0.65rem;
            background: rgba(255, 255, 255, 0.08); border: 1px solid var(--glass-border); color: var(--text-dim);
        }
        .ctl-help-btn:hover { background: rgba(255, 255, 255, 0.16); color: var(--text); }
        .ctl-help-btn[aria-expanded="true"] { background: var(--accent-dim); border-color: var(--accent); color: var(--text); }
        .ctl-help-text {
            margin-top: 0.35rem; padding: 0.45rem 0.55rem; background: rgba(255, 255, 255, 0.04);
            border-left: 2px solid var(--accent-dim); border-radius: 4px; font-size: 0.78rem; line-height: 1.45; color: var(--text-dim);
        }

        .ctl-range {
            width: 100%; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; margin-top: 0.35rem; cursor: pointer;
            background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--fill, 0%), rgba(255, 255, 255, 0.15) var(--fill, 0%), rgba(255, 255, 255, 0.15) 100%);
        }
        .ctl-range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 2px solid #1a1a1a; cursor: pointer; margin-top: -5px; }
        .ctl-range::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 2px solid #1a1a1a; cursor: pointer; }
        .ctl-range::-moz-range-track { height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.15); }
        .ctl-range::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }

        .ctl-knob-dial { display: block; margin: 0.3rem auto 0; cursor: grab; touch-action: none; }
        .ctl-knob-dial:focus { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 50%; }
        .ctl-knob-ring { fill: rgba(255, 255, 255, 0.05); stroke: var(--glass-border); stroke-width: 1.5; }
        .ctl-knob-tick { stroke: var(--text-dim); stroke-width: 1.5; }
        .ctl-knob-needle { stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; }

        .ctl-segmented { margin-top: 0.5rem; }
        .ctl-segmented-row { display: flex; border: 1px solid var(--glass-border); border-radius: 8px; overflow: hidden; }
        .ctl-segmented-btn { flex: 1; background: transparent; color: var(--text-dim); border: none; padding: 0.35rem 0; font-size: 0.85rem; cursor: pointer; }
        .ctl-segmented-btn + .ctl-segmented-btn { border-left: 1px solid var(--glass-border); }
        .ctl-segmented-btn.selected { background: var(--accent-dim); color: var(--text); }

        .ctl-toggle-row { display: flex; align-items: center; gap: 0.4rem; margin-top: 0.6rem; }
        .ctl-toggle { display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; cursor: pointer; }

        .ctl-select { display: flex; flex-direction: column; gap: 0.25rem; margin-top: 0.5rem; font-size: 0.9rem; }
        .ctl-select-label-row { display: flex; align-items: center; gap: 0.35rem; }
        .ctl-select select { background: rgba(255, 255, 255, 0.06); color: var(--text); border: 1px solid var(--glass-border); border-radius: 6px; padding: 0.25rem; }
        .ctl-select select option { background: #1a1a1a; color: var(--text); }

        .ctl-readout { display: flex; justify-content: space-between; font-size: 0.85rem; margin-top: 0.4rem; color: var(--text-dim); }
        .ctl-readout-value { font-variant-numeric: tabular-nums; color: var(--text); }

        .ctl-button { width: 100%; margin-top: 0.5rem; padding: 0.4rem; background: rgba(255, 255, 255, 0.08); color: var(--text); border: 1px solid var(--glass-border); border-radius: 6px; cursor: pointer; }
        .ctl-button:hover { background: rgba(255, 255, 255, 0.16); }

        .view-hint { margin-top: 0.6rem; color: var(--text-dim); font-size: 0.75rem; line-height: 1.4; }

        #unsupportedPanel:not([hidden]) { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; max-width: 480px; margin: auto; text-align: center; color: #f88; }
    </style>
</head>
<body>
    <canvas id="gpuCanvas"></canvas>
    <div id="unsupportedPanel" hidden>
        <p>This simulation needs WebGPU, which isn't available in this browser.</p>
        <p id="unsupportedDetail"></p>
    </div>
    <script type="module" src="src/main.js"></script>
</body>
</html>
